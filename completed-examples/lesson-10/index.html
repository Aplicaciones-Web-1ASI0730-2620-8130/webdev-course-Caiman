<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto: página de perfil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="tarjeta-perfil">
    <img class="foto-perfil" src="https://api.dicebear.com/9.x/bottts/svg?seed=Alex" alt="Avatar ilustrado de Alex" width="110" height="110">
    <h1>Alex Rivera</h1>
    <p class="subtitulo">Estudiante y creador web</p>
    <p class="biografia">¡Hola! Me gustan la tecnología, la música y aprender a crear páginas web.</p>
    <section>
      <h2>Mis pasatiempos</h2>
      <ul class="lista-hobbies">
        <li>Videojuegos</li>
        <li>Guitarra</li>
        <li>Robótica</li>
      </ul>
    </section>
    <section>
      <h2>Enlaces para seguir aprendiendo</h2>
      <div class="contenedor-botones">
        <a class="boton" href="https://developer.mozilla.org/es/docs/Web/HTML" target="_blank" rel="noopener noreferrer">Aprender HTML</a>
        <a class="boton" href="https://developer.mozilla.org/es/docs/Web/CSS" target="_blank" rel="noopener noreferrer">Aprender CSS</a>
      </div>
    </section>
  </main>
</body>
</html>
